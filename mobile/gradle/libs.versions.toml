vietmap-sdk = { module = "com.github.vietmap-company:maps-sdk-android", version.ref = "vietmap" }
vietmap-geojson = { module = "com.github.vietmap-company:vietmap-services-geojson-android", version = "1.0.0" }
vietmap-turf = { module = "com.github.vietmap-company:vietmap-services-turf-android", version = "1.0.2" }
gson = { module = "com.google.code.gson:gson", version = "2.10.1" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
