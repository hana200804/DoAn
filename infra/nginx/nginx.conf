# Định tuyến theo docs/03-kien-truc.md §6. Mọi request có X-Request-Id để truy vết.
server {
    listen 80;
    client_max_body_size 2m;

    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Request-Id $request_id always;

    location /api/v1/auth/  { proxy_pass http://auth-service:8081; }
    location /api/v1/users/ { proxy_pass http://auth-service:8081; }
    location /api/v1/places/ { proxy_pass http://map-service:8082; }
    location = /api/v1/routes { proxy_pass http://map-service:8082; }
    location /api/ { proxy_pass http://sign-service:8083; }

    location / { proxy_pass http://web-admin:80; }
}
