# Chạy toàn bộ hệ thống: cp .env.example .env && docker compose up -d --build
# Điểm vào duy nhất: http://localhost:8080 (API dưới /api, web quản trị ở /)

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7.4
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    # 9000 mở ra ngoài vì app tải ảnh thẳng lên MinIO bằng presigned URL (ADR-0006)
    ports:
      - "9000:9000"
    volumes:
      - minio-data:/data

  auth-service:
    build: { context: ../backend, args: { SERVICE: auth-service } }
    environment:
      DB_URL: jdbc:mysql://mysql:3306/auth_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SPRING_MAIL_HOST: ${MAIL_HOST:-}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  map-service:
    build: { context: ../backend, args: { SERVICE: map-service } }
    environment:
      REDIS_HOST: redis
      VIETMAP_API_KEY: ${VIETMAP_API_KEY}
    depends_on:
      redis: { condition: service_healthy }

  sign-service:
    build: { context: ../backend, args: { SERVICE: sign-service } }
    environment:
      DB_URL: jdbc:mysql://mysql:3306/sign_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }

  web-admin:
    build: ../web-admin

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [auth-service, map-service, sign-service, web-admin]

volumes:
  mysql-data:
  redis-data:
  minio-data:
