[project]
name = "signa-ai"
version = "0.1.0"
description = "Dữ liệu, huấn luyện, đánh giá và xuất mô hình nhận diện biển báo cho Signa"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
  "ultralytics>=8.3,<9",
  "opencv-python-headless>=4.9",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
signa-ai = "signa_ai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
