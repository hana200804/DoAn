name: Web admin

on:
  push:
    branches: [main, dev]
    paths: ["web-admin/**", ".github/workflows/web-admin.yml"]
  pull_request:
    paths: ["web-admin/**", ".github/workflows/web-admin.yml"]

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-admin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
